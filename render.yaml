services:
  - type: web
    name: autocare-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: autocare_database
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:3000,*"
      - key: INTEGRATION_PROXY_URL
        value: "https://integrations.emergentagent.com"
      - key: EMERGENT_LLM_KEY
        sync: false
